<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WISS 研究者管理</title><link rel="stylesheet" href="../booth/style.css"></head><body><header><h1>WISS / 研究者管理</h1></header><main><p id="error" class="error" role="alert"></p>
<div id="dashboard" hidden><section class="card"><h2>ダッシュボード</h2><p id="counts" class="code"></p><div id="notifications"></div></section>
<section class="card"><h2>写真管理 / フレーム化待ち</h2><p>公開に同意された自由撮影写真から、ibisPaintで3種類のフレームを作成してください。</p><details><summary>初期テンプレートの元写真を登録</summary><form id="initial"><label>横4:3の元写真<input name="photo" type="file" accept="image/jpeg,image/png" required></label><label>被写体人数<input name="subjectCount" type="number" min="1" max="6" value="1" required></label><label><input name="rightsConfirmed" type="checkbox" value="true" required>研究保存・ライブラリ公開の利用権と被写体の同意を確認済み</label><button>初期素材として登録</button></form></details><div id="photos" class="grid"></div></section>
<section id="editor" class="card" hidden><h2>手描きフレーム登録</h2><p id="editing"></p><form id="register"><label>フレーム名<input name="name" required maxlength="100"></label><label>被写体人数<input name="subjectCount" type="number" min="1" max="6" required></label><label>お手本写真（横4:3）<input name="reference" type="file" accept="image/jpeg,image/png" required></label><label>ボックスPNG<input name="box" type="file" accept="image/png" required></label><label>シルエットPNG<input name="silhouette" type="file" accept="image/png" required></label><label>ボックス＋顔位置PNG<input name="box_face" type="file" accept="image/png" required></label><label>重ねる種類<select id="previewKind"><option value="box">ボックス</option><option value="silhouette">シルエット</option><option value="box_face">ボックス＋顔位置</option></select></label><div class="frame" style="max-width:720px"><img id="referencePreview" alt="お手本写真"><img id="framePreview" class="overlay" alt="手描きフレーム"></div><p class="muted">位置・寸法を確認してください。元写真を残して別の参照写真として保存します。サーバーでも比率・寸法・透明画素を検証します。</p><button>検証して公開準備完了にする</button></form></section>
<section class="card"><h2>フレームライブラリ管理</h2><div id="references" class="grid"></div></section>
<section class="card"><h2>利用ログ</h2><div class="row"><button id="csvFrames">フレーム別CSV</button><button id="csvSessions">セッション別CSV</button><button id="csvEvents">全イベントCSV</button></div><div id="analytics" class="scroll"></div><h3>最近の操作</h3><div id="recent" class="status"></div></section>
<section class="card"><h2>保存・通知の処理状況</h2><button id="retry">失敗した処理を再試行</button><div id="jobs" class="status"></div></section></div></main><script type="module" src="admin.js"></script></body></html>
