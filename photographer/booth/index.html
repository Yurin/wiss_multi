<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WISS 撮影者</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>WISS / 協調フォトブース</h1><span>撮影者</span></header><main>
<p id="error" class="error" role="alert"></p><section id="start" class="card"><h2>グループで一枚をつくる</h2><p>被写体1〜6人が同じフレームを見ながらポーズを合わせます。</p><button id="create">セッションを開始</button></section>
<div id="session" class="layout" hidden><section><div class="card"><div class="row"><h2 id="mode">自由撮影</h2><span id="connection" class="pill">接続中</span></div><div class="frame"><video id="video" autoplay muted playsinline></video><img id="overlay" class="overlay" alt="確定フレーム" hidden></div><div class="row"><button id="camera">カメラを開始</button><button id="capture" disabled>撮影する</button><button id="free" class="secondary">フレームなしにする</button></div><p class="muted">横4:3・中央クロップ。フレームは写真には焼き込みません。</p></div><section class="card"><h2>撮影した写真</h2><div id="photos" class="grid"></div><button id="retry" class="secondary">失敗したDrive保存を再試行</button></section></section>
<aside><section class="card"><h2>被写体の参加</h2><p id="joinCode" class="code"></p><img id="joinQR" class="qr" alt="参加用QR"><p class="muted">iOSのWISS画面にコードを入力。QRから参加案内を開けます。</p><div id="subjects" class="status"></div><label>代表者<select id="representative"></select></label><button id="transfer" class="secondary">代表者を変更</button></section><section class="card"><h2>グループの提案</h2><div id="proposals" class="status"></div></section><section class="card"><h2>写真を持ち帰る</h2><img id="shareQR" class="qr" alt="このセッションの写真共有QR"><p><a id="shareLink" target="_blank" rel="noreferrer">写真ギャラリーを開く</a></p><p class="muted">このQRを持つ方は、このセッションの保存写真を閲覧できます。</p></section><button id="end" class="danger">セッションを終了</button></aside></div>
<dialog id="review"><h2>この写真を保存しますか？</h2><img id="reviewImage" class="thumb" alt="撮影結果"><p id="consentSummary"></p><button id="save">保存する</button><button id="delete" class="danger">削除する</button><p id="reviewError" class="error" role="alert"></p></dialog>
</main><script type="module" src="photographer.js"></script></body></html>
